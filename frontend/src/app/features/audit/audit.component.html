<header class="page-header">
  <div>
    <h1 class="page-header__title">Audit trail</h1>
    <p class="page-header__subtitle">Every change to employee records, newest first.</p>
  </div>

  <button matButton="outlined" type="button" (click)="load()" [disabled]="loading()">
    <mat-icon aria-hidden="true">refresh</mat-icon>
    Refresh
  </button>
</header>

<mat-card appearance="outlined">
  <mat-card-content>
    <tr-data-state
      [loading]="loading()"
      [error]="error()"
      [empty]="entries().length === 0"
      loadingText="Loading the audit trail…"
      emptyText="Nothing has been recorded yet."
      (retry)="load()">

      <div class="table-scroll">
        <table mat-table [dataSource]="entries()" class="audit-table">

          <ng-container matColumnDef="timestampUtc">
            <th mat-header-cell *matHeaderCellDef>When</th>
            <td mat-cell *matCellDef="let entry">{{ entry.timestampUtc | date: 'dd MMM yyyy, HH:mm' }}</td>
          </ng-container>

          <ng-container matColumnDef="userName">
            <th mat-header-cell *matHeaderCellDef>Who</th>
            <td mat-cell *matCellDef="let entry">{{ entry.userName }}</td>
          </ng-container>

          <ng-container matColumnDef="entity">
            <th mat-header-cell *matHeaderCellDef>Record</th>
            <td mat-cell *matCellDef="let entry">{{ entry.entityName }} #{{ entry.entityId }}</td>
          </ng-container>

          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>Action</th>
            <td mat-cell *matCellDef="let entry">
              <tr-status-badge [label]="entry.action" [tone]="toneFor(entry.action)" />
            </td>
          </ng-container>

          <ng-container matColumnDef="changes">
            <th mat-header-cell *matHeaderCellDef>Changed</th>
            <td mat-cell *matCellDef="let entry" class="audit-table__changes">{{ summarise(entry) }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="columns"></tr>
          <tr mat-row *matRowDef="let row; columns: columns"></tr>
        </table>
      </div>
    </tr-data-state>

    <mat-paginator
      [length]="totalCount()"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[10, 25, 50, 100]"
      (page)="onPage($event)" />
  </mat-card-content>
</mat-card>
